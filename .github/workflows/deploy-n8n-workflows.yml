name: Deploy n8n Workflows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "automation/n8n/**"
      - ".github/workflows/deploy-n8n-workflows.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy and smoke test BAIS n8n workflows
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          set -euo pipefail
          BASE="${N8N_BASE_URL%/}"

          LIST="$(curl -fsS             -H "X-N8N-API-KEY: ${N8N_API_KEY}"             -H "Accept: application/json"             "${BASE}/api/v1/workflows?limit=250")"

          for FILE in automation/n8n/*.json; do
            NAME="$(jq -r '.name' "$FILE")"
            [ "$NAME" != "null" ] || { echo "Missing workflow name in $FILE"; exit 1; }
            PAYLOAD="$(jq '{name,nodes,connections,settings}' "$FILE")"

            # Optional source-controlled references to reusable database sub-workflows.
            # Example in workflow JSON:
            # "baisWorkflowRefs": {"Execute Normalize Contract":"BAIS Academy · Normalize Contract"}
            if jq -e '.baisWorkflowRefs and (.baisWorkflowRefs | length > 0)' "$FILE" >/dev/null; then
              while IFS=

            if [ -z "$ID" ]; then
              echo "Creating workflow: $NAME"
              RESPONSE="$(curl -fsS -X POST                 -H "X-N8N-API-KEY: ${N8N_API_KEY}"                 -H "Content-Type: application/json"                 "${BASE}/api/v1/workflows"                 --data "$PAYLOAD")"
              ID="$(printf '%s' "$RESPONSE" | jq -r '.id')"
              LIST="$(printf '%s' "$LIST" | jq --arg id "$ID" --arg name "$NAME" '.data += [{id:$id,name:$name}]')"
            else
              echo "Updating workflow: $NAME ($ID)"
              curl -fsS -X PUT                 -H "X-N8N-API-KEY: ${N8N_API_KEY}"                 -H "Content-Type: application/json"                 "${BASE}/api/v1/workflows/${ID}"                 --data "$PAYLOAD" >/tmp/n8n-update.json
            fi

            test -n "$ID"
            curl -fsS -X POST               -H "X-N8N-API-KEY: ${N8N_API_KEY}"               -H "Content-Type: application/json"               "${BASE}/api/v1/workflows/${ID}/activate"               --data '{}' >/tmp/n8n-activate.json

            SMOKE_PATH="$(jq -r '.baisSmoke.path // empty' "$FILE")"
            if [ -n "$SMOKE_PATH" ]; then
              SMOKE_BODY="$(jq -c '.baisSmoke.body' "$FILE")"
              EXPECT_FILTER="$(jq -r '.baisSmoke.expect.filter' "$FILE")"
              EXPECT_VALUE="$(jq -r '.baisSmoke.expect.value' "$FILE")"
              echo "Smoke testing: $NAME → $SMOKE_PATH"
              RESPONSE="$(curl -fsS -X POST                 -H "Content-Type: application/json"                 "${BASE}/webhook/${SMOKE_PATH}"                 --data "$SMOKE_BODY")"
              echo "$RESPONSE" | jq .
              ACTUAL="$(echo "$RESPONSE" | jq -r "$EXPECT_FILTER")"
              test "$ACTUAL" = "$EXPECT_VALUE" || {
                echo "Smoke test failed for $NAME: expected $EXPECT_VALUE, got $ACTUAL"
                exit 1
              }
            fi
          done

          echo "All BAIS n8n workflows deployed and verified."
\t' read -r NODE_NAME TARGET_NAME; do
                TARGET_ID="$(printf '%s' "$LIST" | jq -r --arg name "$TARGET_NAME" '.data[]? | select(.name==$name) | .id' | head -n1)"
                [ -n "$TARGET_ID" ] || {
                  echo "Referenced sub-workflow not found before deploying $NAME: $TARGET_NAME"
                  echo "Ensure the referenced workflow JSON sorts before its caller."
                  exit 1
                }
                echo "Resolving sub-workflow reference: $NODE_NAME → $TARGET_NAME ($TARGET_ID)"
                PAYLOAD="$(printf '%s' "$PAYLOAD" | jq \
                  --arg node "$NODE_NAME" \
                  --arg id "$TARGET_ID" \
                  --arg target "$TARGET_NAME" \
                  '(.nodes[] | select(.name==$node) | .parameters.workflowId) = {"__rl":true,"value":$id,"mode":"list","cachedResultName":$target}')"
              done < <(jq -r '.baisWorkflowRefs | to_entries[] | [.key,.value] | @tsv' "$FILE")
            fi

            ID="$(printf '%s' "$LIST" | jq -r --arg name "$NAME" '.data[]? | select(.name==$name) | .id' | head -n1)"

            if [ -z "$ID" ]; then
              echo "Creating workflow: $NAME"
              RESPONSE="$(curl -fsS -X POST                 -H "X-N8N-API-KEY: ${N8N_API_KEY}"                 -H "Content-Type: application/json"                 "${BASE}/api/v1/workflows"                 --data "$PAYLOAD")"
              ID="$(printf '%s' "$RESPONSE" | jq -r '.id')"
              LIST="$(printf '%s' "$LIST" | jq --arg id "$ID" --arg name "$NAME" '.data += [{id:$id,name:$name}]')"
            else
              echo "Updating workflow: $NAME ($ID)"
              curl -fsS -X PUT                 -H "X-N8N-API-KEY: ${N8N_API_KEY}"                 -H "Content-Type: application/json"                 "${BASE}/api/v1/workflows/${ID}"                 --data "$PAYLOAD" >/tmp/n8n-update.json
            fi

            test -n "$ID"
            curl -fsS -X POST               -H "X-N8N-API-KEY: ${N8N_API_KEY}"               -H "Content-Type: application/json"               "${BASE}/api/v1/workflows/${ID}/activate"               --data '{}' >/tmp/n8n-activate.json

            SMOKE_PATH="$(jq -r '.baisSmoke.path // empty' "$FILE")"
            if [ -n "$SMOKE_PATH" ]; then
              SMOKE_BODY="$(jq -c '.baisSmoke.body' "$FILE")"
              EXPECT_FILTER="$(jq -r '.baisSmoke.expect.filter' "$FILE")"
              EXPECT_VALUE="$(jq -r '.baisSmoke.expect.value' "$FILE")"
              echo "Smoke testing: $NAME → $SMOKE_PATH"
              RESPONSE="$(curl -fsS -X POST                 -H "Content-Type: application/json"                 "${BASE}/webhook/${SMOKE_PATH}"                 --data "$SMOKE_BODY")"
              echo "$RESPONSE" | jq .
              ACTUAL="$(echo "$RESPONSE" | jq -r "$EXPECT_FILTER")"
              test "$ACTUAL" = "$EXPECT_VALUE" || {
                echo "Smoke test failed for $NAME: expected $EXPECT_VALUE, got $ACTUAL"
                exit 1
              }
            fi
          done

          echo "All BAIS n8n workflows deployed and verified."
