name: Deploy n8n Workflows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "automation/n8n/**"
      - ".github/workflows/deploy-n8n-workflows.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy BAIS Academy Modul 01 lab
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          set -euo pipefail
          BASE="${N8N_BASE_URL%/}"
          FILE="automation/n8n/bais-academy-modul-01.json"
          NAME="$(jq -r '.name' "$FILE")"
          PAYLOAD="$(jq '{name,nodes,connections,settings}' "$FILE")"

          LIST="$(curl -fsS             -H "X-N8N-API-KEY: ${N8N_API_KEY}"             -H "Accept: application/json"             "${BASE}/api/v1/workflows?limit=250")"

          ID="$(printf '%s' "$LIST" | jq -r --arg name "$NAME" '.data[]? | select(.name==$name) | .id' | head -n1)"

          if [ -z "$ID" ]; then
            echo "Creating workflow: $NAME"
            RESPONSE="$(curl -fsS -X POST               -H "X-N8N-API-KEY: ${N8N_API_KEY}"               -H "Content-Type: application/json"               "${BASE}/api/v1/workflows"               --data "$PAYLOAD")"
            ID="$(printf '%s' "$RESPONSE" | jq -r '.id')"
          else
            echo "Updating workflow: $NAME ($ID)"
            curl -fsS -X PUT               -H "X-N8N-API-KEY: ${N8N_API_KEY}"               -H "Content-Type: application/json"               "${BASE}/api/v1/workflows/${ID}"               --data "$PAYLOAD" >/tmp/n8n-update.json
          fi

          test -n "$ID"
          curl -fsS -X POST             -H "X-N8N-API-KEY: ${N8N_API_KEY}"             -H "Content-Type: application/json"             "${BASE}/api/v1/workflows/${ID}/activate"             --data '{}' >/tmp/n8n-activate.json

          echo "Smoke testing production webhook..."
          RESPONSE="$(curl -fsS -X POST             -H "Content-Type: application/json"             "${BASE}/webhook/bais-academy-modul-01"             --data '{"name":"Max Mustermann","email":"max@example.com","company":"Muster GmbH","budget":7500}')"
          echo "$RESPONSE" | jq .
          test "$(echo "$RESPONSE" | jq -r '.route')" = "qualified"
          echo "n8n Modul 01 workflow deployed and verified."
