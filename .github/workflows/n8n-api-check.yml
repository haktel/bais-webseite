name: n8n API Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/n8n-api-check.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/n8n-api-check.yml"

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify n8n API access
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u

          STATE="failure"
          DESCRIPTION="n8n API connectivity failed"
          HTTP_STATUS="000"

          if [ -z "${N8N_BASE_URL:-}" ] || [ -z "${N8N_API_KEY:-}" ]; then
            DESCRIPTION="Missing n8n repository secrets"
          else
            BASE="${N8N_BASE_URL%/}"
            HTTP_STATUS=$(curl -sS -o /tmp/n8n-response.json -w "%{http_code}"               -H "X-N8N-API-KEY: ${N8N_API_KEY}"               -H "Accept: application/json"               "${BASE}/api/v1/workflows?limit=1" || true)

            if [ "${HTTP_STATUS}" -ge 200 ] 2>/dev/null && [ "${HTTP_STATUS}" -lt 300 ] 2>/dev/null; then
              STATE="success"
              DESCRIPTION="RepoCloud n8n API connected"
            else
              DESCRIPTION="n8n API HTTP ${HTTP_STATUS}"
            fi
          fi

          curl -sS -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -d "{"state":"${STATE}","context":"n8n/api-connectivity","description":"${DESCRIPTION}"}"             >/dev/null

          echo "${DESCRIPTION}"

          if [ "${STATE}" != "success" ]; then
            [ -f /tmp/n8n-response.json ] && cat /tmp/n8n-response.json
            exit 1
          fi
