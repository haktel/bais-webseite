name: BAIS Runtime Secret Presence Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-secret-presence-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live Turnstile configuration without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 20 -o /tmp/body -w '%{http_code}'             -X POST 'https://bais-solutions.de/api/contact'             -H 'Content-Type: application/json'             --data '{"name":"Security Probe","email":"probe@example.com","message":"Security configuration probe only; no data should be stored.","turnstileToken":"invalid-token-value"}')"
          echo "HTTP_STATUS=$code"
          if [ "$code" = "400" ]; then
            echo "TURNSTILE_RUNTIME=CONFIGURED"
          elif [ "$code" = "503" ] && grep -q 'turnstile_not_configured' /tmp/body; then
            echo "TURNSTILE_RUNTIME=MISSING"
          else
            echo "TURNSTILE_RUNTIME=INDETERMINATE"
            cat /tmp/body
            exit 1
          fi
