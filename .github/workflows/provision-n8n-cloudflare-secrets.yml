name: Provision n8n Cloudflare Secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/provision-n8n-cloudflare-secrets.yml"

permissions:
  contents: read
  statuses: write

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_ALT: ${{ secrets.CF_API_TOKEN }}
      CF_TOKEN_ALT2: ${{ secrets.CLOUDFLARE_TOKEN }}
      N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Provision encrypted Pages Function secrets
        shell: bash
        run: |
          set -euo pipefail

          status() {
            local state="$1" desc="$2"
            jq -nc --arg state "$state" --arg context "bais/cloudflare-n8n-secrets" --arg description "$desc"               '{state:$state,context:$context,description:$description}'               | curl -fsS -X POST                   -H "Authorization: Bearer ${GH_TOKEN}"                   -H "Accept: application/vnd.github+json"                   -H "X-GitHub-Api-Version: 2022-11-28"                   "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"                   --data @- >/dev/null || true
          }

          trap 'status failure "Cloudflare secret provisioning failed"' ERR

          CF_TOKEN="${CF_TOKEN_PRIMARY:-${CF_TOKEN_ALT:-${CF_TOKEN_ALT2:-}}}"
          if [ -z "${CF_TOKEN}" ]; then
            status failure "Missing Cloudflare API token repository secret"
            echo "No supported Cloudflare API token secret found."
            exit 1
          fi
          if [ -z "${N8N_BASE_URL:-}" ]; then
            status failure "Missing N8N_BASE_URL repository secret"
            echo "N8N_BASE_URL is missing."
            exit 1
          fi

          AUTH=(-H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json")
          ACCOUNT_ID="$(curl -fsS "${AUTH[@]}" https://api.cloudflare.com/client/v4/accounts             | jq -r '.result[0].id // empty')"
          test -n "${ACCOUNT_ID}"

          PROJECT="bais-webseite"
          PROJECT_JSON="$(curl -fsS "${AUTH[@]}"             "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT}")"
          echo "${PROJECT_JSON}" | jq -e '.success == true' >/dev/null

          WEBHOOK_URL="${N8N_BASE_URL%/}/webhook/bais-lead-qualification"
          WEBHOOK_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::${WEBHOOK_URL}"
          echo "::add-mask::${WEBHOOK_SECRET}"

          PROD_VARS="$(echo "${PROJECT_JSON}" | jq -c '.result.deployment_configs.production.env_vars // {}')"
          PREVIEW_VARS="$(echo "${PROJECT_JSON}" | jq -c '.result.deployment_configs.preview.env_vars // {}')"

          PROD_MERGED="$(jq -nc             --argjson old "${PROD_VARS}"             --arg url "${WEBHOOK_URL}"             --arg secret "${WEBHOOK_SECRET}"             '$old + {
              N8N_LEAD_WEBHOOK:{type:"secret_text",value:$url},
              N8N_WEBHOOK_SECRET:{type:"secret_text",value:$secret}
            }')"

          PREVIEW_MERGED="$(jq -nc             --argjson old "${PREVIEW_VARS}"             --arg url "${WEBHOOK_URL}"             --arg secret "${WEBHOOK_SECRET}"             '$old + {
              N8N_LEAD_WEBHOOK:{type:"secret_text",value:$url},
              N8N_WEBHOOK_SECRET:{type:"secret_text",value:$secret}
            }')"

          PATCH="$(jq -nc             --argjson prod "${PROD_MERGED}"             --argjson preview "${PREVIEW_MERGED}"             '{deployment_configs:{
              production:{env_vars:$prod},
              preview:{env_vars:$preview}
            }}')"

          RESPONSE="$(curl -fsS -X PATCH "${AUTH[@]}"             "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT}"             --data "${PATCH}")"
          echo "${RESPONSE}" | jq -e '.success == true' >/dev/null

          # Persist the same secret only inside GitHub Actions' encrypted artifact is intentionally avoided.
          # The value remains available only in Cloudflare; n8n guard activation is a separate controlled step.
          status success "Cloudflare n8n secrets provisioned"
          echo "Cloudflare Pages production/preview n8n secrets provisioned."
