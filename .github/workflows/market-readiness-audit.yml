name: BAIS Market Readiness Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "preise/**"
      - "kontakt/**"
      - "impressum/**"
      - "datenschutz/**"
      - "referenzen/**"
      - "loesungen/**"
      - "ueber-bais/**"
      - "project-portal/**"
      - "sitemap.xml"
      - "robots.txt"
      - "_headers"
      - "functions/api/n8n-demo.js"
      - "functions/_lib/n8n*.js"
      - "scripts/market-readiness-audit.sh"
      - "scripts/market-link-audit.py"
      - ".github/workflows/market-readiness-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Run live market readiness audit
        run: bash scripts/market-readiness-audit.sh
