name: BAIS Mail Secret Presence Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mail-secret-presence-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Check repository mail credential presence without disclosure
        shell: bash
        run: |
          if [ -n "${RESEND_API_KEY:-}" ]; then
            echo "RESEND_REPOSITORY_SECRET=PRESENT"
          else
            echo "RESEND_REPOSITORY_SECRET=MISSING"
          fi
