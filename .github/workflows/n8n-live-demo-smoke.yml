name: Live n8n Demo Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/api/n8n-demo.js"
      - "functions/_lib/n8n.js"
      - "referenzen/n8n-live-demo/**"
      - "assets/n8n-live-demo.*"
      - ".github/workflows/n8n-live-demo-smoke.yml"

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify deployed BAIS demo and n8n execution
        shell: bash
        run: |
          set -euo pipefail

          post_status() {
            local state="$1" desc="$2"
            jq -nc --arg state "$state" --arg context "bais/n8n-live-smoke" --arg description "$desc"               '{state:$state,context:$context,description:$description}'               | curl -fsS -X POST                   -H "Authorization: Bearer ${GH_TOKEN}"                   -H "Accept: application/vnd.github+json"                   -H "X-GitHub-Api-Version: 2022-11-28"                   "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"                   --data @- >/dev/null || true
          }

          trap 'post_status failure "Live n8n demo smoke failed"' ERR

          test -n "${N8N_BASE_URL:-}"
          test -n "${N8N_API_KEY:-}"

          PAGE_OK=0
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 10 "https://bais-solutions.de/referenzen/n8n-live-demo/"               | grep -q "LIVE N8N AUTOMATION DEMO"; then
              PAGE_OK=1
              break
            fi
            sleep 10
          done
          test "${PAGE_OK}" = "1"

          RESPONSE=""
          for attempt in $(seq 1 18); do
            HTTP="$(curl -sS --max-time 20               -o /tmp/n8n-demo-response.json               -w "%{http_code}"               -X POST               -H "Origin: https://bais-solutions.de"               -H "Content-Type: application/json"               "https://bais-solutions.de/api/n8n-demo"               --data '{"scenario":"automation","urgency":"planned"}' || true)"

            if [ "${HTTP}" = "200" ] && jq -e '.ok == true and .source == "live-n8n"' /tmp/n8n-demo-response.json >/dev/null 2>&1; then
              RESPONSE="$(cat /tmp/n8n-demo-response.json)"
              break
            fi
            echo "Live endpoint not ready yet (HTTP ${HTTP}); retrying."
            sleep 10
          done

          test -n "${RESPONSE}"
          EXECUTION_ID="$(echo "${RESPONSE}" | jq -r '.executionId // empty')"
          ROUTE="$(echo "${RESPONSE}" | jq -r '.route // empty')"
          UPSTREAM="$(echo "${RESPONSE}" | jq -r '.upstreamStatus // empty')"
          test -n "${EXECUTION_ID}"
          test -n "${ROUTE}"
          test "${UPSTREAM}" = "200"

          BASE="${N8N_BASE_URL%/}"
          VERIFY_HTTP="$(curl -sS --max-time 20             -o /tmp/n8n-execution.json             -w "%{http_code}"             -H "X-N8N-API-KEY: ${N8N_API_KEY}"             -H "Accept: application/json"             "${BASE}/api/v1/executions/${EXECUTION_ID}" || true)"

          test "${VERIFY_HTTP}" = "200"
          VERIFIED_ID="$(jq -r '.id // empty' /tmp/n8n-execution.json)"
          test "${VERIFIED_ID}" = "${EXECUTION_ID}"

          echo "Live BAIS endpoint returned a real n8n execution."
          echo "Execution ID: ${EXECUTION_ID}"
          echo "Route: ${ROUTE}"
          post_status success "Live demo verified against RepoCloud execution"
